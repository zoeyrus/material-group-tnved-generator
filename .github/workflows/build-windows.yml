name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TNVED_JSON --collect-all openpyxl --collect-all xlrd tnved_json.py
      - uses: actions/upload-artifact@v4
        with:
          name: TNVED_JSON-Windows
          path: dist/TNVED_JSON.exe
          if-no-files-found: error
