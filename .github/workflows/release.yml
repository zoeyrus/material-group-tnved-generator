name: Publish v1.1.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v1.1.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check interface and all output modes
        shell: python
        run: |
          import json
          import tnved_json as m
          app = m.App()
          app.update()
          for mode in ('Один файл', 'Два файла'):
              app.layout.set(mode)
              app.update_layout()
              app.update()
              assert str(app.name_entries[2].cget('state')) == ('normal' if mode == 'Один файл' else 'disabled')
          app.destroy()
          for fmt in ('json', 'sql'):
              for single in (True, False):
                  outputs, count = m.render_outputs([('001', '0409000000')], fmt, single)
                  assert len(outputs) == (1 if single else 2)
                  assert count == 1
                  if fmt == 'json':
                      assert all(isinstance(json.loads(text), list) for text in outputs)
                  assert any('ON CONFLICT DO NOTHING' in text for text in outputs)
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TNVED_JSON --collect-all openpyxl --collect-all xlrd tnved_json.py
      - uses: actions/upload-artifact@v4
        with:
          name: TNVED_JSON-v1.1.0-Windows
          path: dist/TNVED_JSON.exe
          if-no-files-found: error
      - name: Publish release
        shell: bash
        run: |
          test -s dist/TNVED_JSON.exe
          cat > notes.md <<'NOTES'
          - Выбор формата: JSON или SQL.
          - Выбор количества файлов: один или два, с редактируемыми именами.
          - В объединённом файле сначала справочник ТН ВЭД, затем связки групп.
          - Для связок добавлено ON CONFLICT DO NOTHING, как в SQL-эталоне.
          - SQL сохраняется как текст запросов с комментариями, JSON — как массив SQL-строк.

          Скачайте TNVED_JSON.exe и запустите на Windows. Python не нужен.
          Проверены четыре режима вывода и создание интерфейса на Windows.
          NOTES
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "Release already exists; no changes made."
          else
            gh release create v1.1.0 dist/TNVED_JSON.exe --target "$GITHUB_SHA" --title "v1.1.0 — JSON / SQL, один или два файла" --notes-file notes.md --latest
          fi
